<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Life & Wellness Tracker</title>
  <link rel="stylesheet" href="styles.css" /> </head> <body>
  <header>
    <h1>🌿 Life & Wellness Tracker</h1>
  </header>

  <main>
    <section class="card mood">
      <h2>Mood & Emotions</h2>
      <p>Track how you’re feeling each day.</p>
    </section>

    <section class="card food">
      <h2>Food & Supplements</h2>
      <p>Log meals, hydration, and supplements.</p>
    </section>

    <section class="card sleep">
      <h2>Sleep</h2>
      <p>Record sleep hours and quality.</p>
    </section>

    <section class="card workouts">
      <h2>Workouts & Activity</h2>
      <p>Track strength, cardio, and dragon boat training.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
